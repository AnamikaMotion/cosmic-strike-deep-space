<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cosmic Strike: Deep Space — Cinematic Edition</title>
    <link rel="stylesheet" href="style.css">
    <!-- Three.js and Addons via CDN -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>
    <div id="canvas-container"></div>

    <!-- Cinematic Overlay / UI Container -->
    <div id="ui-layer">
        <!-- Cinematic Intro Skip Prompt -->
        <div id="intro-overlay" style="display:none;">
            <div class="intro-text">CINEMATIC INTRO SEQUENCE...</div>
            <button id="btn-skip-intro" class="btn secondary">SKIP INTRO</button>
        </div>

        <!-- Main Menu -->
        <div id="main-menu" class="screen active">
            <div class="hero-title">
                <h1>COSMIC STRIKE</h1>
                <h2>DEEP SPACE</h2>
                <p class="tagline">Cinematic Orbital Combat Experience</p>
            </div>
            <div class="menu-box">
                <button id="btn-start" class="btn primary">LAUNCH CAMPAIGN</button>
                <button id="btn-cinematic" class="btn secondary">PLAY CINEMATIC TRAILER</button>
                <button id="btn-settings" class="btn secondary">GRAPHICS & AUDIO</button>
            </div>
        </div>

        <!-- Active Gameplay HUD -->
        <div id="gameplay-hud" class="screen">
            <div class="hud-top">
                <div class="hud-panel">SCORE: <span id="hud-score">0</span></div>
                <div class="hud-panel camera-badge">CAMERA: <span id="hud-cam-mode">COMBAT</span></div>
                <div class="hud-panel">WAVE: <span id="hud-wave">1</span></div>
                <button id="btn-pause" class="btn-icon">⏸</button>
            </div>
            
            <div class="hud-center">
                <div class="reticle"></div>
                <div id="boss-container" style="display:none;">
                    <div class="boss-label">ORBITAL DREADNOUGHT BOSS</div>
                    <div class="health-bar"><div id="boss-hp"></div></div>
                </div>
            </div>

            <div class="hud-bottom">
                <div class="stat-group">
                    <label>HULL INTEGRITY</label>
                    <div class="health-bar"><div id="player-hp"></div></div>
                </div>
                <div class="stat-group">
                    <label>AFTERBURNER</label>
                    <div class="health-bar boost"><div id="player-boost"></div></div>
                </div>
                <div class="hud-hints">WASD / Arrow Keys: Fly | SPACE: Laser | SHIFT: Boost | C: Toggle Camera</div>
            </div>
        </div>

        <!-- Pause Menu -->
        <div id="pause-menu" class="screen">
            <div class="modal">
                <h2>SIMULATION PAUSED</h2>
                <button id="btn-resume" class="btn primary">RESUME</button>
                <button id="btn-restart" class="btn secondary">RESTART MISSION</button>
                <button id="btn-quit" class="btn secondary">MAIN MENU</button>
            </div>
        </div>

        <!-- Game Over / Victory Screen -->
        <div id="result-screen" class="screen">
            <div class="modal">
                <h2 id="result-title">MISSION COMPLETE</h2>
                <p>Final Score: <span id="res-score">0</span></p>
                <button id="btn-retry" class="btn primary">PLAY AGAIN</button>
                <button id="btn-menu" class="btn secondary">MAIN MENU</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
