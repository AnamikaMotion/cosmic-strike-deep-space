<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cosmic Strike: Deep Space — Cinematic Edition</title>
    
    <!-- Embedded CSS to completely eliminate 404 errors -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #010204;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #e2f1ff;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(2, 5, 12, 0.6);
            backdrop-filter: blur(4px);
            pointer-events: auto;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .screen.active {
            display: flex;
            opacity: 1;
        }
        .hero-title {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 4rem;
            letter-spacing: 6px;
            color: #00ffff;
            text-shadow: 0 0 30px rgba(0, 255, 255, 0.7), 0 0 60px rgba(0, 128, 255, 0.4);
        }
        h2 {
            font-size: 1.8rem;
            letter-spacing: 4px;
            color: #79c0ff;
            margin-top: 5px;
        }
        .tagline {
            font-size: 0.95rem;
            color: #8b949e;
            letter-spacing: 2px;
            margin-top: 8px;
            text-transform: uppercase;
        }
        .menu-box, .modal {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 340px;
            background: rgba(10, 18, 32, 0.85);
            border: 1px solid rgba(0, 255, 255, 0.3);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(0, 100, 255, 0.25);
        }
        .btn {
            width: 100%;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            transition: all 0.25s ease;
        }
        .btn.primary {
            background: linear-gradient(135deg, #00ffff, #0088ff);
            color: #020408;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
        }
        .btn.primary:hover {
            filter: brightness(1.2);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.7);
        }
        .btn.secondary {
            background: transparent;
            color: #00ffff;
            border: 1px solid rgba(0, 255, 255, 0.5);
        }
        .btn.secondary:hover {
            background: rgba(0, 255, 255, 0.15);
        }
        #gameplay-hud {
            background: none;
            backdrop-filter: none;
            pointer-events: none;
            justify-content: space-between;
            padding: 25px;
        }
        #gameplay-hud * { pointer-events: auto; }
        .hud-top {
            display: flex;
            width: 100%;
            justify-content: space-between;
            align-items: center;
        }
        .hud-panel {
            background: rgba(5, 12, 24, 0.8);
            border: 1px solid rgba(0, 255, 255, 0.3);
            padding: 10px 20px;
            font-weight: 700;
            border-radius: 4px;
            letter-spacing: 1px;
        }
        .btn-icon {
            background: rgba(5, 12, 24, 0.8);
            border: 1px solid rgba(0, 255, 255, 0.4);
            color: #00ffff;
            font-size: 1.2rem;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 4px;
        }
        .hud-center {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .reticle {
            width: 30px;
            height: 30px;
            border: 2px solid rgba(0, 255, 255, 0.4);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
        }
        #boss-container {
            position: absolute;
            top: 40px;
            width: 450px;
            background: rgba(20, 5, 5, 0.85);
            border: 1px solid #ff4444;
            padding: 12px;
            border-radius: 4px;
            text-align: center;
        }
        .boss-label {
            color: #ff4444;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }
        .hud-bottom {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }
        .stat-group {
            width: 320px;
            background: rgba(5, 12, 24, 0.8);
            border: 1px solid rgba(0, 255, 255, 0.3);
            padding: 10px 15px;
            border-radius: 4px;
        }
        .stat-group label {
            font-size: 0.75rem;
            color: #8ab4f8;
            letter-spacing: 1px;
            margin-bottom: 5px;
            display: block;
        }
        .health-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }
        .health-bar div {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #0088ff, #00ffff);
            transition: width 0.15s ease;
        }
        .health-bar.boost div {
            background: linear-gradient(90deg, #ff8800, #ffaa00);
        }
        #boss-hp {
            background: linear-gradient(90deg, #aa0000, #ff4444);
        }
        .hud-hints {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 18px;
            border-radius: 20px;
            letter-spacing: 1px;
        }
        #intro-overlay {
            position: absolute;
            bottom: 40px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }
        .intro-text {
            color: #00ffff;
            font-weight: 700;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }
    </style>

    <!-- Three.js and Addons via CDN -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>
    <div id="canvas-container"></div>

    <!-- Cinematic Overlay / UI Container -->
    <div id="ui-layer">
        <!-- Cinematic Intro Skip Prompt -->
        <div id="intro-overlay" style="display:none;">
            <div class="intro-text">CINEMATIC INTRO SEQUENCE...</div>
            <button id="btn-skip-intro" class="btn secondary">SKIP INTRO</button>
        </div>

        <!-- Main Menu -->
        <div id="main-menu" class="screen active">
            <div class="hero-title">
                <h1>COSMIC STRIKE</h1>
                <h2>DEEP SPACE</h2>
                <p class="tagline">Cinematic Orbital Combat Experience</p>
            </div>
            <div class="menu-box">
                <button id="btn-start" class="btn primary">LAUNCH CAMPAIGN</button>
                <button id="btn-cinematic" class="btn secondary">PLAY CINEMATIC TRAILER</button>
                <button id="btn-settings" class="btn secondary">GRAPHICS & AUDIO</button>
            </div>
        </div>

        <!-- Active Gameplay HUD -->
        <div id="gameplay-hud" class="screen">
            <div class="hud-top">
                <div class="hud-panel">SCORE: <span id="hud-score">0</span></div>
                <div class="hud-panel camera-badge">CAMERA: <span id="hud-cam-mode">COMBAT</span></div>
                <div class="hud-panel">WAVE: <span id="hud-wave">1</span></div>
                <button id="btn-pause" class="btn-icon">⏸</button>
            </div>
            
            <div class="hud-center">
                <div class="reticle"></div>
                <div id="boss-container" style="display:none;">
                    <div class="boss-label">ORBITAL DREADNOUGHT BOSS</div>
                    <div class="health-bar"><div id="boss-hp"></div></div>
                </div>
            </div>

            <div class="hud-bottom">
                <div class="stat-group">
                    <label>HULL INTEGRITY</label>
                    <div class="health-bar"><div id="player-hp"></div></div>
                </div>
                <div class="stat-group">
                    <label>AFTERBURNER</label>
                    <div class="health-bar boost"><div id="player-boost"></div></div>
                </div>
                <div class="hud-hints">WASD / Arrow Keys: Fly | SPACE: Laser | SHIFT: Boost | C: Toggle Camera</div>
            </div>
        </div>

        <!-- Pause Menu -->
        <div id="pause-menu" class="screen">
            <div class="modal">
                <h2>SIMULATION PAUSED</h2>
                <button id="btn-resume" class="btn primary">RESUME</button>
                <button id="btn-restart" class="btn secondary">RESTART MISSION</button>
                <button id="btn-quit" class="btn secondary">MAIN MENU</button>
            </div>
        </div>

        <!-- Game Over / Victory Screen -->
        <div id="result-screen" class="screen">
            <div class="modal">
                <h2 id="result-title">MISSION COMPLETE</h2>
                <p>Final Score: <span id="res-score">0</span></p>
                <button id="btn-retry" class="btn primary">PLAY AGAIN</button>
                <button id="btn-menu" class="btn secondary">MAIN MENU</button>
            </div>
        </div>
    </div>

    <!-- Main Game Script Module -->
    <script type="module" src="./js/main.js"></script>
</body>
</html>
